<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benefit Bridge SMS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">BENEFIT BRIDGE</p>
          <h1>SMS inbox</h1>
        </div>
        <div id="connection" class="connection">Checking connection…</div>
      </header>

      <section class="layout">
        <form id="composer" class="card composer">
          <h2>Send a text</h2>
          <label>To <input id="to" name="to" placeholder="+15551234567" inputmode="tel" required /></label>
          <label>Message <textarea id="body" name="body" maxlength="1600" placeholder="Write your message…" required></textarea></label>
          <div class="compose-footer"><span id="count">0 / 1600</span><button type="submit">Send SMS</button></div>
          <p id="form-message" class="form-message" aria-live="polite"></p>
        </form>

        <section class="card messages">
          <div class="messages-heading"><div><h2>Messages</h2><p>Auto-refreshes every 10 seconds.</p></div><button id="refresh" class="secondary">Refresh</button></div>
          <div id="message-list" class="message-list"><p class="empty">No messages yet.</p></div>
        </section>
      </section>
    </main>
    <template id="message-template">
      <article class="message">
        <div class="message-meta"><span class="direction"></span><span class="status"></span><time></time></div>
        <p class="route"></p>
        <p class="message-body"></p>
      </article>
    </template>
    <script src="/app.js"></script>
  </body>
</html>
