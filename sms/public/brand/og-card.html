<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
         background: linear-gradient(135deg, #1f6048 0%, #14412f 60%, #0d2c20 100%);
         color: #fff; display: flex; flex-direction: column; justify-content: space-between;
         padding: 78px 84px; overflow: hidden; position: relative; }
  .glow { position: absolute; width: 620px; height: 620px; border-radius: 50%;
          background: radial-gradient(circle, rgba(158,203,183,.34) 0%, rgba(158,203,183,0) 70%);
          top: -230px; right: -170px; }
  .eyebrow { font-size: 25px; font-weight: 800; letter-spacing: .20em; color: #9ecbb7; }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -.045em; font-weight: 800; max-width: 15ch; }
  p { font-size: 33px; color: #cfe3d8; margin-top: 26px; max-width: 26ch; line-height: 1.35; }
  .row { display: flex; align-items: center; gap: 20px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: #7fd6a8; }
  .row span { font-size: 26px; color: #a8c6b6; font-weight: 650; }
</style></head><body>
  <div class="glow"></div>
  <div class="eyebrow">BENEFIT BRIDGE</div>
  <div>
    <h1>Your benefits, one text away.</h1>
    <p>Tap to see what you qualify for.</p>
  </div>
  <div class="row"><div class="dot"></div><span>Secure &middot; Takes about 2 minutes</span></div>
</body></html>
